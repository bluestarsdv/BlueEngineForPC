name: Build BlueEngine ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install NASM, Build Tools and ISO Maker
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-multilib cmake dosfstools mtools xorriso

    - name: Configure CMake
      run: |
        rm -rf build
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_ASM_NASM_OBJECT_FORMAT=elf32

    - name: Build Kernel
      run: cmake --build build --config Release

    - name: Generate boot.img
      run: |
        mkdir -p build
        dd if=/dev/zero of=build/boot.img bs=1024 count=1440
        dd if=build/blue_game_engine of=build/boot.img conv=notrunc

    - name: Generate system.img (FAT File System)
      run: |
        # 1. Cria a imagem zerada de 10MB e formata em FAT16
        dd if=/dev/zero of=build/system.img bs=1M count=10
        mkfs.vfat -F 16 -n "SYSTEM" build/system.img
        
        # 2. Prepara diretório temporário para a estrutura do sysroot
        mkdir -p build/sysroot_temp
        
        # Copia todos os arquivos da pasta sysroot se existirem
        if [ -d "sysroot" ]; then
          cp -r sysroot/* build/sysroot_temp/ 2>/dev/null || true
        fi
        
        # 3. Garante que a pasta /system/bin exista
        mkdir -p build/sysroot_temp/system/bin
        
        # 4. Compila QUALQUER arquivo .c na raiz de /system/ para a pasta /system/bin
        shopt -s nullglob
        if [ -d "build/sysroot_temp/system" ]; then
          for file in build/sysroot_temp/system/*.c; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .c)
              gcc -m32 -ffreestanding -nostdlib -O2 "$file" -o "build/sysroot_temp/system/bin/$filename"
              rm -f "$file"
            fi
          done
        fi
        
        # 5. Copia a estrutura pronta para dentro da system.img
        mcopy -i build/system.img -s build/sysroot_temp/* ::/

        # 6. Cria a pasta /dev na raiz da system.img
        mmd -i build/system.img ::/dev

        # 7. Marcadores de /dev (Usando arquivo temporário para evitar erros de pipe no mcopy)
        touch build/empty_dev
        mcopy -i build/system.img build/empty_dev ::/dev/null
        mcopy -i build/system.img build/empty_dev ::/dev/zero
        mcopy -i build/system.img build/empty_dev ::/dev/full
        mcopy -i build/system.img build/empty_dev ::/dev/random
        mcopy -i build/system.img build/empty_dev ::/dev/urandom
        mcopy -i build/system.img build/empty_dev ::/dev/console
        mcopy -i build/system.img build/empty_dev ::/dev/tty
        mcopy -i build/system.img build/empty_dev ::/dev/fb0
        mcopy -i build/system.img build/empty_dev ::/dev/sda
        mcopy -i build/system.img build/empty_dev ::/dev/sda1
        mcopy -i build/system.img build/empty_dev ::/dev/fd0
        mcopy -i build/system.img build/empty_dev ::/dev/stdin
        mcopy -i build/system.img build/empty_dev ::/dev/stdout
        mcopy -i build/system.img build/empty_dev ::/dev/stderr
        rm -f build/empty_dev

    - name: Generate ISO Image (blue_engine.iso)
      run: |
        # Prepara a pasta temporária da ISO
        mkdir -p build/iso_root
        
        # Copia boot.img e system.img para dentro do diretório raiz da ISO
        cp build/boot.img build/iso_root/boot.img
        cp build/system.img build/iso_root/system.img
        
        # Empacota tudo em blue_engine.iso com boot El Torito
        xorriso -as mkisofs \
          -b boot.img \
          -no-emul-boot \
          -boot-load-size 4 \
          -boot-info-table \
          -o build/blue_engine.iso \
          build/iso_root

    - name: Upload Single ISO Artifact (blue_engine.iso)
      uses: actions/upload-artifact@v4
      with:
        name: blue-engine-iso
        path: build/blue_engine.iso
        
